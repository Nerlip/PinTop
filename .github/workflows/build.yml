name: build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build PinTop.sln -c Release

      - name: Publish
        run: >
          dotnet publish src/PinTop/PinTop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: PinTop-win-x64
          path: dist/PinTop.exe
          if-no-files-found: error
